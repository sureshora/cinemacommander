[project]
name = "cinema-commander"
version = "0.2.0"
description = "Standalone agentic production intelligence project for the Agentic Cinema hackathon"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
